name: Deploy Docs to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/prehydrate/**"
      - ".github/workflows/deploy-docs.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run build --filter docs
        env:
          NEXT_PUBLIC_ORAMA_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_ORAMA_PROJECT_ID }}
          NEXT_PUBLIC_ORAMA_API_KEY: ${{ secrets.NEXT_PUBLIC_ORAMA_API_KEY }}
          NEXT_PUBLIC_ORAMA_DATASOURCE_ID: ${{ secrets.NEXT_PUBLIC_ORAMA_DATASOURCE_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        run: npx wrangler pages deploy out --project-name=prehydrate-docs --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
